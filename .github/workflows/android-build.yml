# Android CI Build Workflow for DIGS

name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK
      uses: android-actions/setup-android@v2

    - name: Set up Android NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21e"

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        target: 'android'
        arch: 'android'
        modules: 'qtcharts'

    - name: Build APK
      run: |
        # Clone mavlink library with both common and ardupilotmega dialects (project uses ardupilotmega which has VTOL types)
        echo "=== Cloning mavlink library ==="
        mkdir -p libs/mavlink/include/mavlink/v2.0
        git clone --depth 1 --branch master https://github.com/mavlink/c_library_v2.git libs/mavlink-temp
        # Copy root-level mavlink files (mavlink.h, mavlink_types.h, protocol.h)
        cp -r libs/mavlink-temp/*.h libs/mavlink/include/mavlink/v2.0/
        # Create proper subdirectories and copy files into them
        mkdir -p libs/mavlink/include/mavlink/v2.0/common
        mkdir -p libs/mavlink/include/mavlink/v2.0/ardupilotmega
        cp -r libs/mavlink-temp/common/* libs/mavlink/include/mavlink/v2.0/common/
        cp -r libs/mavlink-temp/ardupilotmega/* libs/mavlink/include/mavlink/v2.0/ardupilotmega/
        rm -rf libs/mavlink-temp
        
        echo "=== Verifying mavlink ==="
        ls -la libs/mavlink/include/mavlink/v2.0/
        ls -la libs/mavlink/include/mavlink/v2.0/common/
        ls -la libs/mavlink/include/mavlink/v2.0/ardupilotmega/
        
        # Set up Qt environment from install-qt action
        export PATH="$QT_ROOT_DIR/bin:$PATH"
        export QT_QPA_PLATFORM=offscreen
        
        # Try both possible NDK versions
        if [ -d "$ANDROID_HOME/ndk/21.4.7075529" ]; then
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529
        elif [ -d "$ANDROID_HOME/ndk/21e" ]; then
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21e
        else
          echo "ERROR: Android NDK not found"
          ls -la $ANDROID_HOME/ndk/
          exit 1
        fi
        
        echo "=== Qt paths ==="
        ls -la "$QT_ROOT_DIR/bin/"
        
        echo "=== Running qmake ==="
        # Set absolute paths - MAVLINKPATH should point to folder containing common/ and ardupilotmega/ subdirectories
        PROJDIR=$(pwd)
        mkdir -p build
        cd build
        qmake -spec android-clang ANDROID_TARGET_ARCH=arm64-v8a SOURCE_DIR=$PROJDIR MAVLINKPATH=$PROJDIR/libs/mavlink/include/mavlink/v2.0 $PROJDIR/qgroundcontrol.pro 2>&1 || exit 1
        echo "=== Running make ==="
        make -j$(nproc) 2>&1 || exit 1

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DIGS-debug.apk
        path: build/android-build/bin/*.apk
