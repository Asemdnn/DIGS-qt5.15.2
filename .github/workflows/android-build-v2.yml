# Android CI Build Workflow for DIGS - v2

name: Android Build v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: true

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android SDK
      uses: android-actions/setup-android@v2

    - name: Set up Android NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21e"

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        target: 'android'
        arch: 'android'
        modules: 'qtcharts'

    - name: Build APK
      run: |
        echo "=== Verifying mavlink ==="
        ls -la libs/mavlink/
        ls -la libs/mavlink/common/
        ls -la libs/mavlink/ardupilotmega/
        
        export PATH="$QT_ROOT_DIR/bin:$PATH"
        export QT_QPA_PLATFORM=offscreen
        
        if [ -d "$ANDROID_HOME/ndk/21.4.7075529" ]; then
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529
        else
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21e
        fi
        
        export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export PATH=$ANDROID_NDK_ROOT:$PATH
        
        mkdir -p build
        cd build
        
        cmake .. \
          -DQt5_DIR=$QT_ROOT_DIR/lib/cmake/Qt5 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=$QT_ROOT_DIR/lib/cmake/Qt5Android/Qt5AndroidToolChain.cmake \
          -DANDROID_PLATFORM=android-24 \
          -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
          -DANDROID_NDK=$ANDROID_NDK_ROOT \
          -DWITH_APPS=ON \
          -Dlibevents_DIR=$(pwd)/../libs/libevents/libevents
        
        make -j$(nproc)
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DIGS-APK
        path: build/QGroundControl.apk